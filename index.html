<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SUNNY</title>
  <meta name="theme-color" content="#121417">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://gibs.earthdata.nasa.gov" crossorigin>
  <link rel="dns-prefetch" href="https://gibs.earthdata.nasa.gov">
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.open-meteo.com">
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org">
  <link rel="preconnect" href="https://mesonet.agron.iastate.edu" crossorigin>
  <link rel="dns-prefetch" href="https://mesonet.agron.iastate.edu">
  <link rel="preconnect" href="https://api.rainviewer.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.rainviewer.com">
  <link rel="preconnect" href="https://tilecache.rainviewer.com" crossorigin>
  <link rel="dns-prefetch" href="https://tilecache.rainviewer.com">
  <link rel="stylesheet" href="vendor/maplibre-gl.slim.css?v=opt33">
  <link rel="stylesheet" href="styles.css?v=opt33">
</head>
<body>
  <div id="map"></div>
  <!-- Unused (opt11/opt13): static clouds are main-map rasters. Kept hidden for DOM stability. -->
  <div id="cloud-map" class="is-unused" aria-hidden="true" hidden></div>
  <!-- Play-only cloud image overlay (opt8): WMS GetMap double-buffer, screen blend -->
  <div id="cloud-play-layer" aria-hidden="true" hidden>
    <img class="cloud-play-buf cloud-play-a" alt="" draggable="false">
    <img class="cloud-play-buf cloud-play-b" alt="" draggable="false">
  </div>
  <div class="hud">
    <p id="status" class="status">Finding you… Clouds sit lightly on the map so land stays visible.</p>
  </div>
  <div class="timeline">
    <div class="transport-row">
      <div class="speed-wrap">
        <button id="btn-speed" class="tbtn tbtn-speed" type="button" title="Speed 1x" aria-label="Speed 1x" aria-expanded="false" aria-haspopup="listbox" aria-controls="speed-menu">
          <svg class="tbtn-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.75"/>
            <path d="M12 7.5v5l3.2 1.9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="speed-menu" class="speed-menu" role="listbox" aria-label="Playback speed" hidden>
          <button type="button" class="speed-opt" role="option" data-speed="0.5" aria-selected="false">0.5x</button>
          <button type="button" class="speed-opt" role="option" data-speed="1" aria-selected="true">1x</button>
          <button type="button" class="speed-opt" role="option" data-speed="1.5" aria-selected="false">1.5x</button>
          <button type="button" class="speed-opt" role="option" data-speed="2" aria-selected="false">2x</button>
          <button type="button" class="speed-opt" role="option" data-speed="3" aria-selected="false">3x</button>
        </div>
      </div>
      <label class="tbtn tbtn-loop" id="loop-btn" title="Loop on" aria-pressed="true">
        <input id="toggle-loop" type="checkbox" checked class="sr-only">
        <svg class="tbtn-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M17.5 7.5A6.5 6.5 0 0 0 7.2 9.1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M7.5 5.2v4.1h4.1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 16.5A6.5 6.5 0 0 0 16.8 14.9" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          <path d="M16.5 18.8v-4.1h-4.1" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </label>
      <button id="btn-play" class="tbtn tbtn-play play" type="button" aria-label="Play cloud animation" aria-pressed="false" title="Play">
        <svg class="tbtn-ico" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path d="M8.2 5.6v12.8l11-6.4z" fill="currentColor"/>
        </svg>
      </button>
      <div class="track-wrap">
        <span class="now-mark">NOW</span>
        <input id="time-slider" type="range" min="0" max="0" value="0" step="1">
        <div id="time-ticks" class="time-ticks" aria-hidden="true"></div>
      </div>
      <span id="time-label">Clouds</span>
      <select id="play-speed" class="sr-only" tabindex="-1" aria-hidden="true">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
        <option value="3">3x</option>
      </select>
    </div>
    <div class="layer-row">
      <div class="ov overlay-mode" role="group" aria-label="Overlay">
        <span class="basemap-label">Overlay</span>
        <div class="seg" id="overlay-seg">
          <button type="button" class="seg-btn is-on" data-overlay="clouds" aria-pressed="true">Clouds</button>
          <button type="button" class="seg-btn" data-overlay="radar" aria-pressed="false">Radar</button>
        </div>
      </div>
      <label class="ov opacity-opt" id="cloud-opacity-label">Clouds
        <input id="cloud-opacity" type="range" min="0" max="100" value="90" step="1">
      </label>
    </div>
    <div class="map-row">
      <div class="ov basemap" role="group" aria-label="Map style">
        <span class="basemap-label">Map</span>
        <div class="seg" id="basemap-seg">
          <button type="button" class="seg-btn is-on" data-basemap="roads" aria-pressed="true">Roads</button>
          <button type="button" class="seg-btn" data-basemap="satellite" aria-pressed="false">Satellite</button>
          <button type="button" class="seg-btn" data-basemap="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
      <label class="ov switch">
        <input id="toggle-map" type="checkbox">
        <span class="knob" aria-hidden="true"></span>
        Labels
      </label>
      <label class="ov switch">
        <input id="toggle-intl" type="checkbox">
        <span class="knob" aria-hidden="true"></span>
        International
      </label>
    </div>
  </div>
  <div class="controls">
    <button id="btn-locate" class="ctrl" type="button">Locate me</button>
    <button id="btn-all" class="ctrl" type="button" aria-pressed="false">All beaches</button>
    <div class="sun-stack">
      <button id="btn-sun" class="ctrl ctrl-sun" type="button" disabled>
        <span class="beach-emoji" aria-hidden="true">🏖️</span>
        <span class="ctrl-label">Find Nearest Beaches</span>
      </button>
      <label class="sun-opt"><input id="toggle-sunny" type="checkbox" checked> Sunny</label>
    </div>
  </div>
  <aside id="sunny-sheet" class="sunny-panel" hidden aria-labelledby="sunny-sheet-title">
    <div class="sunny-panel-head">
      <h2 id="sunny-sheet-title">Sunny beaches</h2>
      <button type="button" id="sunny-sheet-close" class="sheet-close" aria-label="Close list">×</button>
    </div>
    <p id="sunny-sheet-sub" class="sheet-sub"></p>
    <ul id="sunny-sheet-list" class="sheet-list"></ul>
  </aside>
  <div id="fps" aria-hidden="true">— fps</div>
  <!-- MapLibre deferred before app.js (opt21: no preload — avoids SW cross-world mismatch) -->
  <script defer src="vendor/maplibre-gl.js?v=opt33"></script>
  <script defer src="app.js?v=opt33"></script>
</body>
</html>

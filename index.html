    /* opt153: map layers start off. Once per browser, every saved layer switch is reset to off; later choices are kept */
    (function () {
      try {
        if (localStorage.getItem("sunny-layers-off-v1")) return;
        window.SunnyLayersReset = true; /* layers-panel.js turns each registered layer off */
        ["sunny-wind", "sunny-craters", "sunny-skyglow", "sunny-observatories", "sunny-crown"].forEach(function (k) { localStorage.setItem(k, "0"); });
        localStorage.setItem("sunny-layers-off-v1", "1");
      } catch (e) {}
    })();
  </script>
  <script>
    /* opt60: users always stay on the main URL; ?v=optNN is internal cache-bust only */
    (function () {
      try {
        var u = new URL(location.href);
        var v = u.searchParams.get("v");
        if (v && /^opt[-_]?\d+/i.test(String(v))) {
          u.searchParams.delete("v");
          var q = u.searchParams.toString();
          history.replaceState(history.state, "", u.pathname + (q ? "?" + q : "") + u.hash);
        }
      } catch (eBare) {}
    })();
  </script>
